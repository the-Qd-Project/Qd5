name: Build Qd
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
  packages: write
jobs:
  linux:
    name: Linux ${{ matrix.os }} Build
    env:
      QT_QPA_PLATFORM: offscreen
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
          - os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: recursive
      - name: Setup dependencies
        id: setup-dependencies
        uses: $/.github/actions/setup-dependencies
        with:
          target: desktop
      - name: Configure
        shell: bash
        run: |
          ./configure \
            -prefix /usr \
            -docdir /usr/share/doc/qt \
            -headerdir /usr/include/qt \
            -archdatadir /usr/lib/qt \
            -datadir /usr/share/qt \
            -sysconfdir /etc/xdg \
            -examplesdir /usr/share/doc/qt/examples \
            -opensource \
            -confirm-license \
            -c++std c++17 \
            -v -qt-zlib \
            -qt-doubleconversion \
            -qt-pcre \
            -qt-freetype \
            -qt-harfbuzz \
            -qt-libpng \
            -qt-libjpeg \
            -qt-sqlite \
            -qt-assimp \
            -qt-tiff \
            -qt-webp \
            -openssl-runtime \
            -opengl desktop \
            -journald \
            -libproxy \
            -no-rpath \
            -dbus-linked \
            -make tests \
            -make examples \
            -make tools \
            -make libs \
            -ccache \
            -release \
            -platform linux-g++
      - name: Build
        shell: bash
        run: make -j"$(nproc)"
      - name: Test
        shell: bash
        continue-on-error: true
        run: make check
      - name: Install
        shell: bash
        run: make INSTALL_ROOT="$RUNNER_TEMP/qt-install" install
      # TODO: Package
  macos:
    name: macOS Build
    runs-on: macos-26
    env:
      MACOSX_DEPLOYMENT_TARGET: 10.13
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: recursive
      - name: Setup dependencies
        id: setup-dependencies
        uses: $/.github/actions/setup-dependencies
        with:
          target: desktop
      - name: Configure
        shell: bash
        run: |
          ./configure \
            -prefix /Qt/Qt5 \
            -opensource \
            -confirm-license \
            -opengl desktop \
            -c++std c++17 \
            -v -qt-zlib \
            -qt-doubleconversion \
            -qt-pcre \
            -qt-freetype \
            -qt-harfbuzz \
            -qt-libpng \
            -qt-libjpeg \
            -qt-sqlite \
            -qt-assimp \
            -qt-tiff \
            -qt-webp \
            -make tests \
            -make examples \
            -make tools \
            -make libs \
            -ccache \
            -release \
            -platform macx-clang
      - name: Build
        shell: bash
        run: make -j"$(sysctl -n hw.ncpu)"
      - name: Test
        shell: bash
        continue-on-error: true
        run: make check
      - name: Install
        shell: bash
        run: make INSTALL_ROOT="$RUNNER_TEMP/qt-install" install
      # TODO: Package
  android:
    name: Android ${{ matrix.android-abi }} Build
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            android-abi: arm64-v8a
          - os: ubuntu-24.04
            android-abi: armeabi-v7a
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: recursive
      - name: Setup dependencies
        id: setup-dependencies
        uses: $/.github/actions/setup-dependencies
        with:
          target: android
      - name: Configure
        shell: bash
        run: |
          ./configure \
            -prefix /Qt \
            -archdatadir /Qt \
            -datadir /Qt \
            -docdir /Qt/doc \
            -examplesdir /Qt/examples \
            -opensource \
            -confirm-license \
            -c++std c++17 \
            -v -qt-zlib \
            -qt-doubleconversion \
            -qt-pcre \
            -qt-freetype \
            -qt-harfbuzz \
            -qt-libpng \
            -qt-libjpeg \
            -qt-sqlite \
            -qt-assimp \
            -qt-tiff \
            -qt-webp \
            -opengl es2 \
            -android-sdk "$ANDROID_SDK_ROOT" \
            -android-ndk "$ANDROID_NDK_ROOT" \
            -android-abis "${{ matrix.android-abi }}" \
            -nomake tests \
            -nomake examples \
            -make tools \
            -make libs \
            -ccache \
            -xplatform android-clang \
            -android-ndk-host linux-x86_64 \
            -release
      - name: Build
        shell: bash
        run: make -j"$(nproc)"
      - name: Install
        shell: bash
        run: make INSTALL_ROOT="$RUNNER_TEMP/qt-install" install
      # TODO: Package
  ios:
    name: iOS ${{ matrix.ios-sdk }} Build
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-26
            ios-sdk: iphoneos
          - os: macos-26
            ios-sdk: iphonesimulator
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: recursive
      - name: Setup dependencies
        id: setup-dependencies
        uses: $/.github/actions/setup-dependencies
        with:
          target: ios
          ios-sdk: ${{ matrix.ios-sdk }}
      - name: Configure
        shell: bash
        run: |
          ./configure \
            -prefix /Qt \
            -archdatadir /Qt \
            -datadir /Qt \
            -docdir /Qt/doc \
            -examplesdir /Qt/examples \
            -opensource \
            -confirm-license \
            -c++std c++17 \
            -v -qt-zlib \
            -qt-doubleconversion \
            -qt-pcre \
            -qt-freetype \
            -qt-harfbuzz \
            -qt-libpng \
            -qt-libjpeg \
            -qt-sqlite \
            -qt-assimp \
            -qt-tiff \
            -qt-webp \
            -xplatform macx-ios-clang \
            -release \
            -sdk "${{ matrix.ios-sdk }}" \
            -nomake tests \
            -nomake examples \
            -make tools \
            -make libs \
            -ccache
      - name: Build
        shell: bash
        run: make -j"$(sysctl -n hw.ncpu)"
      - name: Install
        shell: bash
        run: make INSTALL_ROOT="$RUNNER_TEMP/qt-install" install
      # TODO: Package
  windows_mingw:
    name: Windows MinGW UCRT64 Build
    runs-on: windows-2025
    defaults:
      run:
        shell: ${{ 'msys2 {0}' || 'bash' }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: recursive
      - name: Setup dependencies
        id: setup-dependencies
        uses: $/.github/actions/setup-dependencies
        with:
          msystem: UCRT64
          vcvars-arch: amd64_x86
          target: desktop
      - name: Configure
        run: |
          ./configure \
            -prefix "/c/Qt" \
            -opensource \
            -confirm-license \
            -c++std c++17 \
            -v -qt-zlib \
            -qt-doubleconversion \
            -qt-pcre \
            -qt-freetype \
            -qt-harfbuzz \
            -qt-libpng \
            -qt-libjpeg \
            -qt-sqlite \
            -qt-assimp \
            -qt-tiff \
            -qt-webp \
            -openssl-runtime \
            -platform win32-g++ \
            -debug-and-release \
            -opengl desktop \
            -make tests \
            -make examples \
            -make tools \
            -make libs
      - name: Build
        run: make -j"$(nproc)"
      - name: Test
        continue-on-error: true
        run: make check
      - name: Install
        run: make INSTALL_ROOT="$RUNNER_TEMP/qt-install" install
      # TODO: Package
  windows_msvc:
    name: Windows MSVC ${{ matrix.vcvars-arch }} Build
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            vcvars-arch: amd64
          - os: windows-11-arm
            vcvars-arch: arm64
    runs-on: ${{ matrix.os }}
    env:
      CONFIGURE_ARGS: ${{ matrix.configure }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: recursive
      - name: Setup dependencies
        id: setup-dependencies
        uses: $/.github/actions/setup-dependencies
        with:
          vcvars-arch: ${{ matrix.vcvars-arch }}
          target: desktop
      - name: Configure
        shell: cmd
        run: |
          configure.bat ^
            -prefix "C:\Qt" ^
            -opensource ^
            -confirm-license ^
            -c++std c++17 ^
            -v -qt-zlib ^
            -qt-doubleconversion ^
            -qt-pcre ^
            -qt-freetype ^
            -qt-harfbuzz ^
            -qt-libpng ^
            -qt-libjpeg ^
            -qt-sqlite ^
            -qt-assimp ^
            -qt-tiff ^
            -qt-webp ^
            -openssl-runtime ^
            -debug-and-release ^
            -platform win32-msvc ^
            -opengl desktop ^
            -make tests ^
            -make examples ^
            -make tools ^
            -make libs ^
            -ccache
          if errorlevel 1 exit /b %errorlevel%
      - name: Build
        shell: pwsh
        run: jom /J 1 /D /W
      - name: Test
        shell: pwsh
        continue-on-error: true
        run: jom check
      - name: Install
        shell: pwsh
        run: jom "INSTALL_ROOT=$env:RUNNER_TEMP\qt-install" install
      # TODO: Package
