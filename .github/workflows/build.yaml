name: Build Qd
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
  packages: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-26.04
            target: desktop
            configure: -release -platform linux-g++
          - os: ubuntu-26.04-arm
            target: desktop
            configure: -release -platform linux-g++
          - os: windows-2025
            vcvars-arch: amd64
            target: desktop
            configure: -debug-and-release -platform win32-msvc2019
          - os: windows-11-arm
            vcvars-arch: arm64
            target: desktop
            configure: -debug-and-release -platform win32-msvc2019
          - os: windows-2025
            msystem: UCRT64
            vcvars-arch: amd64_x86
            target: desktop
            configure: -platform win32-g++ -debug-and-release
          - os: macos-26
            macosx-deployment-target: 10.13
            target: desktop
            configure: -release -platform macx-clang
          - os: ubuntu-26.04
            target: android
            android-abi: arm64-v8a
            configure: -xplatform android-clang -android-ndk-host linux-x86_64 -release
          - os: ubuntu-26.04
            target: android
            android-abi: armeabi-v7a
            configure: -xplatform android-clang -android-ndk-host linux-x86_64 -release
          - os: macos-26
            target: ios
            ios-sdk: iphoneos
            ios-arch: arm64
            configure: -xplatform macx-ios-clang -release
          - os: macos-26
            target: ios
            ios-sdk: iphonesimulator
            ios-arch: arm64
            configure: -xplatform macx-ios-clang -release

    runs-on: ${{ matrix.os }}

    defaults:
      run:
        shell: ${{ matrix.msystem != '' && 'msys2 {0}' || 'bash' }}

    env:
      MACOSX_DEPLOYMENT_TARGET: ${{ matrix.macosx-deployment-target }}
      CONFIGURE_ARGS: ${{ matrix.configure }}

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: recursive

      - name: Setup dependencies
        id: setup-dependencies
        uses: $/.github/actions/setup-dependencies
        with:
          msystem: ${{ matrix.msystem }}
          vcvars-arch: ${{ matrix.vcvars-arch }}
          target: ${{ matrix.target }}

      - name: Configure
        run: |
          read -r -a EXTRA_ARGS <<< "$CONFIGURE_ARGS"

          COMMON_ARGS=(
            -prefix "$RUNNER_TEMP/qt-install"
            -opensource
            -confirm-license
            -c++std c++17
            -v
            -qt-zlib
            "${EXTRA_ARGS[@]}"
          )

          case "${{ matrix.target }}" in
            desktop)
              ./configure \
                "${COMMON_ARGS[@]}" \
                -opengl desktop \
                -make tests \
                -make examples \
                -make tools \
                -make libs \
                -ccache
              ;;

            android)
              ./configure \
                "${COMMON_ARGS[@]}" \
                -opengl es2 \
                -android-sdk "$ANDROID_SDK_ROOT" \
                -android-ndk "$ANDROID_NDK_ROOT" \
                -android-abis "${{ matrix.android-abi }}" \
                -nomake tests \
                -nomake examples \
                -make tools \
                -make libs \
                -ccache
              ;;

            ios)
              ./configure \
                "${COMMON_ARGS[@]}" \
                -sdk "${{ matrix.ios-sdk }}" \
                -arch "${{ matrix.ios-arch }}" \
                -nomake tests \
                -nomake examples \
                -make tools \
                -make libs \
                -ccache
              ;;
          esac

      - name: Build (Non MSVC)
        if: ${{ runner.os != 'Windows' || matrix.msystem != '' }}
        run: |
          if command -v nproc >/dev/null 2>&1; then
            JOBS="$(nproc)"
          elif command -v sysctl >/dev/null 2>&1; then
            JOBS="$(sysctl -n hw.ncpu)"
          else
            JOBS="${NUMBER_OF_PROCESSORS:-2}"
          fi

          make -j"$JOBS"

      - name: Build (MSVC)
        if: ${{ runner.os == 'Windows' && matrix.msystem == '' }}
        shell: pwsh
        run: |
          jom /J (Get-CimInstance Win32_ComputerSystem).NumberOfLogicalProcessors

      - name: Test (Non MSVC)
        if: ${{ matrix.target == 'desktop' && ( runner.os != 'Windows' || matrix.msystem != '' ) }}
        run: make check

      - name: Test (MSVC)
        if: ${{ matrix.target == 'desktop' && ( runner.os == 'Windows' && matrix.msystem == '' ) }}
        run: jom check

      - name: Debug DBus controller
        if: ${{ matrix.target == 'desktop' && ( runner.os == 'Linux' && failure() ) }}
        working-directory: qtbase/examples/dbus/remotecontrolledcar/controller
        run: |
          echo "=== GENERATED HEADER ==="
          cat car_interface.h

          echo "=== GENERATED SOURCE ==="
          cat car_interface.cpp

          echo "=== MOC OUTPUT ==="
          cat .moc/moc_car_interface.cpp

          echo "=== MOC SYMBOLS ==="
          nm -C .obj/moc_car_interface.o | grep -E 'OrgExampleExamplesCarInterfaceInterface|staticMetaObject' || true

          echo "=== GENERATED FILE STATUS ==="
          ls -lah car_interface.h car_interface.cpp .moc/moc_car_interface.cpp .obj/moc_car_interface.o

      - name: Install (Non MSVC)
        if: ${{ runner.os != 'Windows' || matrix.msystem != '' }}
        run: make install

      - name: Install (MSVC)
        if: ${{ runner.os == 'Windows' && matrix.msystem == '' }}
        run: jom install

      # TODO: Package
