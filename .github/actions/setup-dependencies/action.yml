name: Setup Dependencies
description: Install and setup dependencies for building the Qd Project

inputs:
  msystem:
    description: MSYS2 subsystem to use
    required: false
  vcvars-arch:
    description: Visual Studio architecture to use
    required: false
  target:
    description: Build target
    required: true
  ios-sdk:
    description: iOS SDK
    required: false

runs:
  using: composite

  steps:
    - name: Setup Java
      uses: actions/setup-java@v6.3.0
      with:
        distribution: zulu
        java-version: 17

    - name: Install dependencies (Linux)
      if: ${{ runner.os == 'Linux' }}
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          build-essential gperf bison flex perl python3 pkg-config \
          clang llvm libclang-dev \
          libgl-dev libglu1-mesa-dev libegl-dev libgles-dev \
          libvulkan-dev libgbm-dev libdrm-dev libgl1-mesa-dri \
          libx11-dev libx11-xcb-dev libxext-dev libxfixes-dev \
          libxi-dev libxrender-dev libxcomposite-dev libxrandr-dev \
          libxcursor-dev libxinerama-dev libsm-dev libice-dev \
          libxcb1-dev libxcb-glx0-dev libxcb-icccm4-dev \
          libxcb-image0-dev libxcb-keysyms1-dev libxcb-randr0-dev \
          libxcb-render0-dev libxcb-render-util0-dev \
          libxcb-shape0-dev libxcb-shm0-dev libxcb-sync-dev \
          libxcb-util-dev libxcb-xfixes0-dev libxcb-xinerama0-dev \
          libxcb-xinput-dev libxcb-xkb-dev \
          libxkbcommon-dev libxkbcommon-x11-dev \
          libfontconfig-dev libfreetype-dev libharfbuzz-dev \
          libglib2.0-dev libdbus-1-dev libatspi2.0-dev \
          libudev-dev libinput-dev libmtdev-dev libts-dev \
          libproxy-dev libkrb5-dev libsctp-dev \
          libicu-dev libpcre2-dev libdouble-conversion-dev \
          libzstd-dev zlib1g-dev libssl-dev libsqlite3-dev \
          libjpeg-dev libpng-dev libmd4c-dev \
          libmng-dev libtiff-dev libwebp-dev \
          default-libmysqlclient-dev libpq-dev unixodbc-dev \
          freetds-dev firebird-dev \
          libgtk-3-dev libcups2-dev \
          libasound2-dev libgstreamer1.0-dev \
          libgstreamer-plugins-base1.0-dev libopenal-dev libpulse-dev \
          libbluetooth-dev libsdl2-dev libassimp-dev \
          libwayland-dev libwayland-egl-backend-dev wayland-protocols \
          flite1-dev libspeechd-dev libsystemd-dev

    - name: Enter VS Developer shell
      if: ${{ runner.os == 'Windows' }}
      uses: ilammy/msvc-dev-cmd@v1.13.0
      with:
        arch: ${{ inputs.vcvars-arch }}

    - name: Setup vcpkg cache (MSVC)
      if: ${{ runner.os == 'Windows' && inputs.msystem == '' }}
      shell: pwsh
      env:
        USERNAME: ${{ github.repository_owner }}
        GITHUB_TOKEN: ${{ github.token }}
        FEED_URL: https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json
      run: |
        .$(vcpkg fetch nuget) `
          sources add `
          -Source "$env:FEED_URL" `
          -StorePasswordInClearText `
          -Name GitHubPackages `
          -UserName "$env:USERNAME" `
          -Password "$env:GITHUB_TOKEN"
        .$(vcpkg fetch nuget) `
          setapikey "$env:GITHUB_TOKEN" `
          -Source "$env:FEED_URL"
        "VCPKG_BINARY_SOURCES=clear;nuget,$env:FEED_URL,readwrite" | Out-File -Append $env:GITHUB_ENV

    - name: Install Windows MSVC build tools
      if: ${{ runner.os == 'Windows' && inputs.msystem == '' }}
      shell: pwsh
      run: |
        choco install -y --no-progress gperf winflexbison3 pkgconfiglite

        $wfb = "$env:ChocolateyInstall\lib\winflexbison3\tools"

        Copy-Item "$wfb\win_bison.exe" "$wfb\bison.exe" -Force
        Copy-Item "$wfb\win_flex.exe" "$wfb\flex.exe" -Force

        Add-Content -Path $env:GITHUB_PATH -Value $wfb


    - name: Install Windows MSVC dependencies
      if: ${{ runner.os == 'Windows' && inputs.msystem == '' }}
      shell: pwsh
      run: |
        $env:VCPKG_ROOT = $env:VCPKG_INSTALLATION_ROOT
        $triplet = if ("${{ inputs.vcvars-arch }}" -eq "arm64") {
          "arm64-windows"
        } else {
          "x64-windows"
        }
        & "$env:VCPKG_ROOT\vcpkg.exe" install `
          --triplet $triplet `
          assimp `
          double-conversion `
          egl-registry `
          freetype `
          harfbuzz `
          icu `
          libjpeg-turbo `
          libpng `
          md4c `
          pcre2 `
          openssl `
          sqlite3 `
          tiff `
          libwebp `
          zlib `
          zstd `
          openal-soft `
          sdl2 `
          'gstreamer[plugins-base]' `
          libpq `
          libmysql `
          vulkan

        $vcpkgPrefix = "$env:VCPKG_ROOT\installed\$triplet"
        $llvmRoot = Split-Path -Parent (Split-Path -Parent (Get-Command clang.exe).Source)

        Add-Content -Path $env:GITHUB_ENV -Value "VCPKG_ROOT=$env:VCPKG_ROOT"
        Add-Content -Path $env:GITHUB_ENV -Value "VCPKG_TARGET_TRIPLET=$triplet"
        Add-Content -Path $env:GITHUB_ENV -Value "VCPKG_PREFIX=$vcpkgPrefix"
        Add-Content -Path $env:GITHUB_ENV -Value "LLVM_INSTALL_DIR=$llvmRoot"

        # Header and library discovery
        Add-Content -Path $env:GITHUB_ENV -Value "INCLUDE=$vcpkgPrefix\include;$env:INCLUDE"
        Add-Content -Path $env:GITHUB_ENV -Value "LIB=$vcpkgPrefix\lib;$env:LIB"

        # pkg-config discovery
        Add-Content -Path $env:GITHUB_ENV -Value "PKG_CONFIG_PATH=$vcpkgPrefix\lib\pkgconfig;$vcpkgPrefix\share\pkgconfig"

    - name: Install JOM
      if: ${{ runner.os == 'Windows' && inputs.msystem == '' }}
      shell: pwsh
      run: |
        $jomVersion = "1.1.7"
        $jomDirectory = "$env:RUNNER_TEMP\jom"

        New-Item -ItemType Directory -Force -Path $jomDirectory | Out-Null

        Invoke-WebRequest `
          -Uri "https://download.qt.io/official_releases/jom/jom_$($jomVersion.Replace('.', '_')).zip" `
          -OutFile "$env:RUNNER_TEMP\jom.zip"

        Expand-Archive `
          -Path "$env:RUNNER_TEMP\jom.zip" `
          -DestinationPath $jomDirectory `
          -Force

        "$jomDirectory" >> $env:GITHUB_PATH

        Remove-Item "$env:RUNNER_TEMP\jom.zip"

    - name: Install MinGW dependencies
      if: ${{ inputs.msystem != '' }}
      uses: msys2/setup-msys2@v2.33.0
      with:
        msystem: ${{ inputs.msystem }}
        update: true
        install: >-
          perl
          rsync
          make
        pacboy: >-
          toolchain:p
          cmake:p
          ccache:p
          ninja:p
          pkgconf:p
          gperf:p
          python:p
          assimp:p
          angleproject:p
          dbus:p
          double-conversion:p
          fontconfig:p
          freetype:p
          harfbuzz:p
          icu:p
          libjpeg-turbo:p
          libpng:p
          md4c:p
          openssl:p
          pcre2:p
          sqlite3:p
          vulkan:p
          vulkan-headers:p
          egl-headers:p
          gles-headers:p
          zlib:p
          zstd:p
          firebird:p
          libmariadbclient:p
          postgresql:p
          jasper:p
          libmng:p
          libtiff:p
          libwebp:p
          openal:p

    - name: Install macOS build tools
      if: ${{ runner.os == 'macOS' }}
      shell: bash
      run: |
        brew install \
          gperf \
          bison \
          flex \
          perl \
          python \
          pkgconf \
          cmake \
          ninja \
          mono \
          autoconf \
          autoconf-archive \
          automake \
          libtool \
          nasm llvm

        echo "LLVM_INSTALL_DIR=$(brew --prefix llvm)" >> "$GITHUB_ENV"

    - name: Setup vcpkg cache (macOS)
      if: ${{ runner.os == 'macOS' }}
      shell: bash
      env:
        USERNAME: ${{ github.repository_owner }}
        GITHUB_TOKEN: ${{ github.token }}
        FEED_URL: https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json
      run: |
        mono `vcpkg fetch nuget | tail -n 1` \
          sources add \
          -Source "$FEED_URL" \
          -StorePasswordInClearText \
          -Name GitHubPackages \
          -UserName "$USERNAME" \
          -Password "$GITHUB_TOKEN"
        mono `vcpkg fetch nuget | tail -n 1` \
          setapikey "$GITHUB_TOKEN" \
          -Source "$FEED_URL"
        echo "VCPKG_BINARY_SOURCES=clear;nuget,$FEED_URL,readwrite" >> "$GITHUB_ENV"

    - name: Install macOS dependencies
      if: ${{ runner.os == 'macOS' }}
      shell: bash
      run: |
        git clone --depth 1 https://github.com/microsoft/vcpkg.git "$RUNNER_TEMP/vcpkg"

        "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.sh" -disableMetrics

        VCPKG_ROOT="$RUNNER_TEMP/vcpkg"

        if [[ "${{ inputs.target }}" == "ios" ]]; then
          case "${{ inputs.ios-sdk }}" in
              iphoneos)
                  TRIPLET="arm64-ios"
                  ;;
              iphonesimulator)
                  if [[ "$(uname -m)" == "arm64" ]]; then
                      TRIPLET="arm64-ios-simulator"
                  else
                      TRIPLET="x64-ios"
                  fi
                  ;;
              *)
                  echo "Unsupported iOS SDK: ${{ inputs.ios-sdk }}"
                  exit 1
                  ;;
          esac

          if [[ "$(uname -m)" == "arm64" ]]; then
              HOST_TRIPLET="arm64-osx"
          else
              HOST_TRIPLET="x64-osx"
          fi
        else
          if [[ "$(uname -m)" == "arm64" ]]; then
              TRIPLET="arm64-osx"
              HOST_TRIPLET="arm64-osx"
          else
              TRIPLET="x64-osx"
              HOST_TRIPLET="x64-osx"
          fi
        fi

        DEPENDENCIES=(
          assimp
          double-conversion
          egl-registry
          fontconfig
          freetype
          harfbuzz
          icu
          libjpeg-turbo
          libpng
          md4c
          pcre2
          openssl
          sqlite3
          tiff
          libwebp
          zlib
          zstd
          openal-soft
          sdl2
          'gstreamer[plugins-base]'
          libpq
          libmysql
          vulkan
        )

        if [[ "${{ inputs.target }}" != "ios" ]]; then
          DEPENDENCIES+=(dbus)
        fi

        "$VCPKG_ROOT/vcpkg" install \
          --triplet "$TRIPLET" \
          --host-triplet "$HOST_TRIPLET" \
          "${DEPENDENCIES[@]}"

        VCPKG_PREFIX="$VCPKG_ROOT/installed/$TRIPLET"

        {
          echo "VCPKG_ROOT=$VCPKG_ROOT"
          echo "VCPKG_TARGET_TRIPLET=$TRIPLET"
          echo "VCPKG_PREFIX=$VCPKG_PREFIX"

          # pkg-config: QMake dependency detection
          echo "PKG_CONFIG_PATH=$VCPKG_PREFIX/lib/pkgconfig:$VCPKG_PREFIX/share/pkgconfig"

          # Compiler header and library discovery
          echo "CPATH=$VCPKG_PREFIX/include"
          echo "LIBRARY_PATH=$VCPKG_PREFIX/lib"

          # Runtime library discovery
          echo "DYLD_LIBRARY_PATH=$VCPKG_PREFIX/lib"
        } >> "$GITHUB_ENV"

    - name: Install macOS SQL dependencies
      if: ${{ runner.os == 'macOS' }}
      shell: bash
      run: |
        brew install unixodbc freetds

    - name: Setup Android SDK
      if: ${{ inputs.target == 'android' }}
      uses: android-actions/setup-android@v4.0.4
      with:
        packages: 'platform-tools'

    - name: Install Android NDK
      if: ${{ inputs.target == 'android' }}
      shell: bash
      run: |
        sdkmanager "platform-tools" \
                   "platforms;android-35" \
                   "build-tools;35.0.0" \
                   "ndk;22.1.7171670"

        echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
        echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/22.1.7171670" >> "$GITHUB_ENV"

    # TODO: Add support of sccache to Qd!
    - name: Setup ccache
      if: ${{ runner.os != 'Windows' && inputs.msystem == '' }}
      uses: hendrikmuhs/ccache-action@v1.2.24
      with:
        variant: ccache
        create-symlink: true
        key: ${{ runner.os }}-${{ runner.arch }}-${{ inputs.target }}-ccache

    - name: Retrieve ccache cache (MinGW)
      if: ${{ inputs.msystem != '' }}
      uses: actions/cache@v6.1.0
      with:
        path: '${{ github.workspace }}\.ccache'
        key: ${{ runner.os }}-mingw-w64-ccache-${{ github.run_id }}
        restore-keys: |
          ${{ runner.os }}-mingw-w64-ccache

    - name: Setup ccache (MinGW)
      if: ${{ inputs.msystem != '' }}
      shell: msys2 {0}
      run: |
        ccache --set-config=cache_dir='${{ github.workspace }}\.ccache'
        ccache --set-config=max_size='500M'
        ccache --set-config=compression=true
        ccache -p  # Show config
